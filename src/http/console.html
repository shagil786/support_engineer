<!doctype html>
<!--
  Operator console — served at GET /console. Static shell only: the page
  authenticates to the same bearer-token JSON surface as any API client
  (/utterance, /approvals, /approvals/:id/sign, /approvals/:id/execute).
  No external assets; the token lives in sessionStorage and is sent only
  to this origin.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Agent Console</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --line: #2a2f3c;
    --text: #e6e9ef; --dim: #8b93a7; --accent: #6ea8fe; --ok: #4ade80;
    --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header input, header button {
    font: inherit; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  }
  header input { width: 230px; }
  header button { cursor: pointer; }
  header button:hover { border-color: var(--accent); }
  #identity { color: var(--dim); font-size: 12px; min-width: 90px; text-align: right; }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: #27406b; border: 1px solid #35507f; }
  .msg.agent { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); }
  .msg .meta { display: block; margin-top: 6px; font-size: 11px; color: var(--dim); }
  .badge {
    display: inline-block; padding: 0 6px; border-radius: 999px;
    font-size: 11px; border: 1px solid var(--line); margin-right: 6px;
  }
  .badge.knowledge { color: var(--ok); border-color: var(--ok); }
  .badge.jira { color: var(--accent); border-color: var(--accent); }
  .badge.logs { color: var(--warn); border-color: var(--warn); }
  .badge.pending { color: var(--warn); border-color: var(--warn); }
  .badge.denied, .badge.veto, .badge.error { color: var(--bad); border-color: var(--bad); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.note { color: var(--dim); }
  #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  #composer input {
    flex: 1; font: inherit; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  #composer input:focus { outline: none; border-color: var(--accent); }
  #composer button {
    font: inherit; background: #27406b; color: var(--text); border: 1px solid #35507f;
    border-radius: 8px; padding: 10px 18px; cursor: pointer;
  }
  #composer button:disabled { opacity: 0.5; cursor: default; }
  #side { width: 360px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #approvals { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .apv { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 8px; padding: 10px 12px; }
  .apv.granted { border-left-color: var(--ok); }
  .apv .t { font-weight: 600; margin-bottom: 4px; }
  .apv .args { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); white-space: pre-wrap; word-break: break-all; margin: 6px 0; }
  .apv .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .apv .row .sig { color: var(--dim); font-size: 12px; flex: 1; }
  .apv button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 4px 10px; cursor: pointer; }
  .apv button.grant { border-color: var(--ok); }
  .apv button:hover { border-color: var(--accent); }
  .empty { color: var(--dim); font-size: 12px; text-align: center; padding: 20px 0; }
  .disconnected { color: var(--bad); font-size: 12px; }
  @media (max-width: 860px) {
    main { flex-direction: column; }
    #side { width: auto; max-height: 38vh; border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Support Agent Console</h1>
  <div class="spacer"></div>
  <input id="token" type="password" placeholder="bearer token" autocomplete="off" />
  <input id="speaker" type="text" placeholder="speaker id (role decides RBAC)" autocomplete="off" style="width:200px" />
  <button id="save-token">Connect</button>
  <span id="identity" class="disconnected">disconnected</span>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="composer">
      <input id="text" type="text" placeholder='Say something — e.g. "hey agent, how do I restart the checkout pod?"' autocomplete="off" />
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </section>
  <aside id="side">
    <h2>Approval queue <span id="apv-count"></span></h2>
    <div id="approvals"><div class="empty">connect to load the queue</div></div>
  </aside>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const log = $('log'), queue = $('approvals');

let token = sessionStorage.getItem('agent-token') || '';
let speaker = sessionStorage.getItem('agent-speaker') || '';

// RBAC is keyed on the speaker id: unknown ids are 'guest' and cannot stage
// destructive actions. The id is editable precisely so an operator can
// connect with the id their role resolver maps to admin/engineer.

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token, ...(opts?.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  return { res, body };
}

function addMsg(kind, text, metaHtml) {
  const div = document.createElement('div');
  div.className = 'msg ' + kind;
  div.textContent = text;
  if (metaHtml) {
    const m = document.createElement('span');
    m.className = 'meta';
    m.innerHTML = metaHtml; // built exclusively from esc() pieces below
    div.appendChild(m);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

const PROVENANCE = {
  knowledge: ['knowledge', 'cited from the knowledge base'],
  jira: ['jira', 'live Jira lookup (read-only)'],
  logs: ['logs', 'live log query'],
};

function agentMeta(r) {
  const parts = [];
  if (r.answerSource && PROVENANCE[r.answerSource]) {
    const [cls, label] = PROVENANCE[r.answerSource];
    parts.push('<span class="badge ' + cls + '">provenance: ' + label + '</span>');
  }
  if (r.approvalId) parts.push('<span class="badge pending">approval staged: ' + esc(r.approvalId) + '</span>');
  else if (r.ok === false && r.reason) parts.push('<span class="badge denied">' + esc(r.reason) + '</span>');
  else if (r.ok === true && !r.answerSource) parts.push('<span class="badge ok">done</span>');
  if (r.reason && r.ok !== false) parts.push('<span class="badge note">' + esc(r.reason) + '</span>');
  return parts.join(' ');
}

$('save-token').addEventListener('click', () => {
  token = $('token').value.trim();
  const typed = $('speaker').value.trim();
  if (typed) speaker = typed;
  if (!token) { $('identity').textContent = 'disconnected'; $('identity').className = 'disconnected'; return; }
  sessionStorage.setItem('agent-token', token);
  sessionStorage.setItem('agent-speaker', speaker);
  $('identity').textContent = 'speaker: ' + speaker;
  $('identity').className = '';
  $('send').disabled = false;
  addMsg('agent', 'Connected as ' + speaker + '. The agent answers from its knowledge base with citations; consequential actions stage approvals here.', '<span class="badge note">connected</span>');
  loadQueue();
  watchQueue();
});

// ---- Live queue: a server-sent-events stream (GET /approvals/events) pushes
// the full listing after every gate mutation. Implemented with fetch + a
// stream reader rather than the EventSource API because EventSource cannot
// send the Authorization header — and the token must never move to the URL,
// where proxies and logs would record it. Disconnects reconnect with backoff.
let queueStream = null;

function watchQueue() {
  if (queueStream) queueStream.abort.abort();
  const abort = new AbortController();
  const backoffMs = { value: 1000 };
  queueStream = { abort, gen: runStream() };

  async function runStream() {
    while (true) {
      try {
        const res = await fetch('/approvals/events', {
          headers: { authorization: 'Bearer ' + token, accept: 'text/event-stream' },
          signal: abort.signal,
        });
        if (res.status === 401) {
          $('identity').textContent = 'session expired — reconnect';
          $('identity').className = 'disconnected';
          return;
        }
        if (!res.ok || !res.body) throw new Error('stream unavailable');
        backoffMs.value = 1000;
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            const frame = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const evLine = frame.split('\n').find((l) => l.startsWith('event: '));
            const dataLine = frame.split('\n').find((l) => l.startsWith('data: '));
            if (!evLine || !dataLine || evLine.slice(7) === 'ping') continue;
            try {
              const parsed = JSON.parse(dataLine.slice(6));
              if (parsed && Array.isArray(parsed.approvals)) renderQueue(parsed.approvals);
            } catch { /* malformed frame: skip, the next push is authoritative */ }
          }
        }
      } catch (e) {
        if (abort.signal.aborted) return;
      }
      if (abort.signal.aborted) return;
      $('identity').textContent = 'queue stream lost — reconnecting';
      $('identity').className = 'disconnected';
      await new Promise((r) => setTimeout(r, backoffMs.value));
      backoffMs.value = Math.min(backoffMs.value * 2, 15_000);
    }
  }
  void queueStream.gen;
}

$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !token) return;
  $('text').value = '';
  addMsg('you', text);
  const send = $('send');
  send.disabled = true;
  try {
    const { res, body } = await api('/utterance', {
      method: 'POST',
      body: JSON.stringify({ speakerId: speaker, text }),
    });
    if (!res.ok) {
      addMsg('agent', 'HTTP ' + res.status + (body.error ? ' — ' + body.error : ''), '<span class="badge error">error</span>');
    } else if (body.routed === 'etiquette') {
      addMsg('agent', '(the agent stays silent — ' + (body.reason || 'etiquette gate') + ')', '<span class="badge note">' + esc(body.routed) + '</span>');
    } else {
      const speech = body.answer || (body.approvalId
        ? 'That needs human approval — the request is staged in the queue on the right.'
        : (body.ok === false ? 'The request was halted: ' + (body.reason || 'unknown reason') : 'Handled.'));
      addMsg('agent', speech, agentMeta(body));
    }
  } catch {
    addMsg('agent', 'Network error — is the server up?', '<span class="badge error">error</span>');
  }
  send.disabled = false;
  loadQueue();
});

async function loadQueue() {
  if (!token) return;
  const { res, body } = await api('/approvals');
  if (!res.ok) return;
  renderQueue(body.approvals || []);
}

function renderQueue(items) {
  $('apv-count').textContent = items.length ? '(' + items.length + ')' : '';
  if (!items.length) {
    queue.innerHTML = '<div class="empty">no pending approvals</div>';
    return;
  }
  queue.innerHTML = '';
  for (const a of items) {
    const granted = a.status === 'granted';
    const card = document.createElement('div');
    card.className = 'apv' + (granted ? ' granted' : '');
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = a.tool + ' — ' + a.reason;
    const args = document.createElement('div');
    args.className = 'args';
    args.textContent = JSON.stringify(a.args);
    const row = document.createElement('div');
    row.className = 'row';
    const sig = document.createElement('span');
    sig.className = 'sig';
    sig.textContent = (granted ? 'granted · ' : '') + 'signatures ' + a.signatures + '/' + a.required + ' · ' + Math.round(a.ageMs / 1000) + 's old';
    const grant = document.createElement('button');
    grant.className = 'grant';
    grant.textContent = 'Sign (admin)';
    grant.disabled = granted;
    grant.addEventListener('click', () => act(a, 'sign'));
    const exec = document.createElement('button');
    exec.textContent = 'Execute';
    exec.disabled = a.signatures < a.required;
    exec.title = a.signatures < a.required ? 'needs ' + (a.required - a.signatures) + ' more signature(s)' : 'run the approved action';
    exec.addEventListener('click', () => act(a, 'execute'));
    row.append(sig, grant, exec);
    card.append(t, args, row);
    queue.appendChild(card);
  }
}

async function act(a, op) {
  if (op === 'sign') {
    const { res, body } = await api('/approvals/' + encodeURIComponent(a.approvalId) + '/sign', {
      method: 'POST',
      // Identity contract: send WHO; the server resolves the role from its
      // own registry. Insufficient privilege comes back as 403.
      body: JSON.stringify({ signerId: speaker }),
    });
    if (!res.ok) addMsg('agent', 'Sign failed: ' + (body.error || res.status), '<span class="badge error">error</span>');
    else addMsg('agent', 'Signed ' + a.approvalId + ' (' + body.status + ', ' + body.signatures + '/' + body.required + ').', '<span class="badge note">approval</span>');
  } else {
    const cid = a.correlationId;
    if (!cid) { addMsg('agent', 'No staged correlation id for this approval — execute from the surface that staged it.', '<span class="badge error">error</span>'); return; }
    const { res, body } = await api('/approvals/' + encodeURIComponent(a.approvalId) + '/execute', {
      method: 'POST',
      body: JSON.stringify({ correlationId: cid }),
    });
    if (!res.ok) addMsg('agent', 'Execute failed: ' + (body.error || res.status), '<span class="badge error">error</span>');
    else addMsg('agent', 'Executed ' + a.approvalId + ': ' + (body.ok ? 'done.' : (body.reason || 'failed.')), body.ok ? '<span class="badge ok">executed</span>' : '<span class="badge denied">failed</span>');
  }
  loadQueue();
}

if (token) {
  $('token').value = token;
  $('save-token').click();
}
</script>
</body>
</html>
